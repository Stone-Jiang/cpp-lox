<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craft Playground</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">C</span>
      <div>
        <strong>Craft</strong>
        <span>Playground</span>
      </div>
    </div>
    <div class="status" id="status" data-state="ready">
      <span class="status-dot"></span>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="section-label">Examples</div>
      <button class="example active" data-example="basics">Basics</button>
      <button class="example" data-example="functions">Functions</button>
      <button class="example" data-example="classes">Classes</button>
      <button class="example" data-example="complex">Complex math</button>
    </aside>

    <section class="editor-panel">
      <div class="panel-toolbar">
        <span class="filename">main.lox</span>
        <div class="toolbar-actions">
          <button class="icon-button" id="clearEditor" title="Clear editor" aria-label="Clear editor">X</button>
          <button class="run-button" id="runCode"><span class="play-icon" aria-hidden="true"></span>Run</button>
        </div>
      </div>
      <div class="editor-wrap">
        <pre class="line-numbers" id="lineNumbers" aria-hidden="true">1</pre>
        <textarea id="editor" spellcheck="false" aria-label="Source code"></textarea>
      </div>
    </section>

    <section class="console-panel">
      <div class="console-tabs" role="tablist">
        <button class="console-tab active" data-view="output" role="tab">Output</button>
        <button class="console-tab" data-view="repl" role="tab">REPL</button>
        <span class="exit-code" id="exitCode"></span>
        <button class="clear-console" id="clearConsole">Clear</button>
      </div>

      <div class="console-view active" id="outputView">
        <pre class="console-output" id="output">Run the program to see output.</pre>
      </div>

      <div class="console-view" id="replView">
        <div class="repl-history" id="replHistory"></div>
        <form class="repl-form" id="replForm">
          <span class="prompt">&gt;</span>
          <input id="replInput" autocomplete="off" spellcheck="false" aria-label="REPL input" placeholder="print 1 + 2;">
          <button type="submit">Send</button>
          <button type="button" id="resetRepl">Reset</button>
        </form>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
